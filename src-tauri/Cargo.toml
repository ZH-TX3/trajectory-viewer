[package]
name = "trajectory-viewer"
version = "0.1.0"
edition = "2021"
description = "DSH Trajectory Viewer — AI session log timeline visualizer"
authors = ["DSH Team"]
license = "MIT"

[lib]
name = "trajectory_viewer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tauri-plugin-opener = "2.5.4"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
