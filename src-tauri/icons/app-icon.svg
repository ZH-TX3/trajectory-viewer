<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景渐变：深蓝 → 天蓝 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- 节点阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ===== A 连接线 ===== -->
  <!-- A 左腿 -->
  <path d="M 200 130 L 155 270 L 120 380" stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- A 右腿 -->
  <path d="M 200 130 L 234 270 L 260 380" stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- A 横杠 -->
  <line x1="155" y1="270" x2="234" y2="270" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

  <!-- ===== I 连接线 ===== -->
  <path d="M 370 130 L 370 270 L 370 380" stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== Git 提交节点 ===== -->
  <g filter="url(#shadow)">
    <!-- A 顶点 -->
    <circle cx="200" cy="130" r="16" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
    <!-- A 左脚 -->
    <circle cx="120" cy="380" r="16" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
    <!-- A 右脚 -->
    <circle cx="260" cy="380" r="16" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
    <!-- A 横杠左 -->
    <circle cx="155" cy="270" r="13" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
    <!-- A 横杠右 -->
    <circle cx="234" cy="270" r="13" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>

    <!-- I 顶部 -->
    <circle cx="370" cy="130" r="16" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
    <!-- I 中部 -->
    <circle cx="370" cy="270" r="13" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>
    <!-- I 底部 -->
    <circle cx="370" cy="380" r="16" fill="#ffffff" stroke="#1e40af" stroke-width="3"/>

    </g>
</svg>